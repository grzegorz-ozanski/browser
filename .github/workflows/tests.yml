name: Run unit tests

on:
  push:
    branches: [ '*' ]
  pull_request:

env:
  COVERAGE_REPORT_FILE: coverage.txt
  # REMOTE_DIR: /home/uploader/upload/incoming
  REMOTE_DIR: upload
  COVERAGE_ARCHIVE: browser-htmlcov.zip
  REPORTS_TS_HOST: 100.127.93.3
  REPORTS_TS_PORT: 2222

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
      contents: write

    steps:
    - name: Checkout current repo
      if: false
      uses: actions/checkout@v4

    - name: Set up Python
      if: false
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      if: false
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      if: false
      shell: pwsh
      run: |
        pip install -r requirements-dev.txt

    - name: Prepare environment
      if: false
      shell: pwsh
      run: |
        # Add browser repo to PYTHONPATH
        echo "PYTHONPATH=$env:GITHUB_WORKSPACE/browser" >> $env:GITHUB_ENV

    - name: Install Pyright
      if: false
      shell: pwsh
      run: |
        npm install -g pyright

    - name: Run tests with coverage
      if: false
      shell: pwsh
      run: |
        coverage run -m pytest
        coverage report

    - name: Generate HTML coverage report
      if: false
#      if: always()
      shell: pwsh
      run: |
        coverage html
        coverage report > ${env:COVERAGE_REPORT_FILE}
        Compress-Archive -Path htmlcov -DestinationPath ${env:COVERAGE_ARCHIVE}

    - name: Add coverage report to summary
      if: false
#      if: always()
      shell: pwsh
      run: |
        echo '### 🧪 Test Coverage Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        cat ${env:COVERAGE_REPORT_FILE} >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Add mypy results to summary
      if: false
#      if: always()
      shell: pwsh
      run: |
        echo '### ✅ Static Analysis Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        mypy . --strict --ignore-missing-imports >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Add pyright results to summary
      if: false
#      if: always()
      shell: pwsh
      run: |
        echo '### ✅ Pyright Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        pyright >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Add ruff results to summary
      if: false
#      if: always()
      shell: pwsh
      run: |
        echo '### ✅ Ruff Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        ruff check . >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}


    - name: Connect to Tailnet (ephemeral)
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        ping: ${{ env.REPORTS_TS_HOST }}

    - name: Debug Tailnet + TCP test
      shell: bash
      run: |
        set -euo pipefail
    
        echo "=== tailscale status ==="
        tailscale status
    
        echo "=== tailscale ip ==="
        tailscale ip
    
        echo "=== Testing TCP ${REPORTS_TS_PORT} ==="
        nc -zv ${REPORTS_TS_HOST} ${REPORTS_TS_PORT}

    - name: Create a test HTML file (with run id)
      shell: bash
      run: |
        set -euo pipefail
        cat > index.html <<HTML
        <!doctype html>
        <html>
          <head><meta charset="utf-8"><title>CI test</title></head>
          <body>
            <h1>Hello from GitHub Actions</h1>
            <p>Run ID: ${GITHUB_RUN_ID}</p>
            <p>SHA: ${GITHUB_SHA}</p>
          </body>
        </html>
        HTML
        ls -la index.html

    - name: Upload coverage archive via SFTP (pwsh, cross-platform)
      shell: bash
      env:
        SFTP_HOST: ${{ secrets.REPORTS_HOST }}
        SFTP_PORT: ${{ secrets.REPORTS_PORT }}   # np. 22
        SFTP_USER: ${{ secrets.REPORTS_USER }}   # np. uploader
        SFTP_KEY:  ${{ secrets.REPORTS_SSH_KEY }}# private key (PEM/OpenSSH)
        LOCAL_FILE: ${{ env.COVERAGE_ARCHIVE }}

      run: |
        set -euo pipefail
    
        mkdir -p ~/.ssh
        printf "%s\n" "SFTP_KEY" > ~/.ssh/reports_key
        chmod 600 ~/.ssh/reports_key
    
        ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
    
        sftp -i ~/.ssh/reports_key -P "$SFTP_PORT" "$SFTP_USER@$SFTP_HOST" <<EOF
        mkdir $REMOTE_DIR
        mkdir $REMOTE_DIR/browser
        cd $REMOTE_DIR/browser
        put index.html
        bye
