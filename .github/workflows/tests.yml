name: Run unit tests

on:
  push:
    branches: [ '*' ]
  pull_request:

env:
  COVERAGE_REPORT_FILE: coverage.txt
  REMOTE_DIR: /home/uploader/upload/incoming
  COVERAGE_ARCHIVE: browser-htmlcov.zip

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
      contents: write

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      shell: pwsh
      run: |
        pip install -r requirements-dev.txt

    - name: Prepare environment
      shell: pwsh
      run: |
        # Add browser repo to PYTHONPATH
        echo "PYTHONPATH=$env:GITHUB_WORKSPACE/browser" >> $env:GITHUB_ENV

    - name: Install Pyright
      shell: pwsh
      run: |
        npm install -g pyright

    - name: Run tests with coverage
      shell: pwsh
      run: |
        coverage run -m pytest
        coverage report

    - name: Generate HTML coverage report
      if: always()
      shell: pwsh
      run: |
        coverage html
        coverage report > ${env:COVERAGE_REPORT_FILE}
        Compress-Archive -Path htmlcov -DestinationPath ${env:COVERAGE_ARCHIVE}

    - name: Add coverage report to summary
      if: always()
      shell: pwsh
      run: |
        echo '### 🧪 Test Coverage Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        cat ${env:COVERAGE_REPORT_FILE} >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Add mypy results to summary
      if: always()
      shell: pwsh
      run: |
        echo '### ✅ Static Analysis Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        mypy . --strict --ignore-missing-imports >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Add pyright results to summary
      if: always()
      shell: pwsh
      run: |
        echo '### ✅ Pyright Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        pyright >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Add ruff results to summary
      if: always()
      shell: pwsh
      run: |
        echo '### ✅ Ruff Summary' >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}
        ruff check . >> ${env:GITHUB_STEP_SUMMARY}
        echo '```' >> ${env:GITHUB_STEP_SUMMARY}

    - name: Upload coverage archive via SFTP (pwsh, cross-platform)
      shell: pwsh
      env:
        SFTP_HOST: ${{ secrets.REPORTS_HOST }}
        SFTP_PORT: ${{ secrets.REPORTS_PORT }}   # np. 22
        SFTP_USER: ${{ secrets.REPORTS_USER }}   # np. uploader
        SFTP_KEY:  ${{ secrets.REPORTS_SSH_KEY }}# private key (PEM/OpenSSH)
        LOCAL_FILE: ${{ env.COVERAGE_ARCHIVE }}
      run: |
        $ErrorActionPreference = "Stop"
    
        # --- sanity check: commands present
        foreach ($cmd in @("ssh","sftp","ssh-keyscan")) {
          if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
            throw "Missing command '$cmd' on runner. Install OpenSSH client or use ubuntu-latest."
          }
        }
    
        # --- write key to a temp file
        $keyPath = Join-Path $env:RUNNER_TEMP "reports_key"
        Set-Content -Path $keyPath -Value $env:SFTP_KEY -NoNewline
        # (chmod) - on Windows this is not required; on Linux/macOS needed
        if ($IsLinux -or $IsMacOS) {
          & chmod 600 $keyPath
        }
    
        # --- known_hosts
        $sshDir = Join-Path $HOME ".ssh"
        New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
        $knownHosts = Join-Path $sshDir "known_hosts"
    
        # ssh-keyscan outputs to stdout; append to known_hosts
        $scan = & ssh-keyscan -p $env:SFTP_PORT $env:SFTP_HOST 2>$null
        if (-not $scan) { throw "ssh-keyscan returned empty output (host unreachable / blocked?)" }
        Add-Content -Path $knownHosts -Value $scan
    
        # --- create a batch file for sftp
        $batchPath = Join-Path $env:RUNNER_TEMP "sftp_batch.txt"
        @"
        mkdir $($env:REMOTE_DIR)
        cd $($env:REMOTE_DIR)
        put $($env:LOCAL_FILE)
        bye
        "@ | Set-Content -Path $batchPath -NoNewline
    
        # --- run sftp in batch mode
        $target = "$($env:SFTP_USER)@$($env:SFTP_HOST)"
        & sftp -i $keyPath -P $env:SFTP_PORT -o "UserKnownHostsFile=$knownHosts" -o "StrictHostKeyChecking=yes" -b $batchPath $target