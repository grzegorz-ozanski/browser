[project]
name = "browser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-strtobool==1.0.3",
    "requests==2.32.3",
    "selenium==4.31.0"
]

[dependency-groups]
dev = [
    "pytest-cov==6.1.1",
    "mypy==1.15.0",
    "ruff==0.11.11",
    "types-requests==2.32.0.20250515"
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"